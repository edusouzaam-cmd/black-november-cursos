name: Gerar pacote KingHost
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: Instalar dependências pelo lockfile
        run: bun install --frozen-lockfile
      - name: Compilar e preparar publicação
        run: bun run build:kinghost
      - name: Validar pacote
        run: bun run validate:kinghost
      - name: Verificar navegação no navegador
        run: |
          npm install --prefix "$RUNNER_TEMP/kinghost-browser" playwright@1.58.2
          node "$RUNNER_TEMP/kinghost-browser/node_modules/playwright/cli.js" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/kinghost-browser/node_modules/playwright/index.mjs" node scripts/check-browser-kinghost.mjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: black-cursos-kinghost
          path: kinghost-package/
          if-no-files-found: error
          retention-days: 30
